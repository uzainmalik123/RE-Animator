name: Reanimator CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: reanimator

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            reanimator/package-lock.json
            poltergeist/package-lock.json
      - run: npm ci
      # Death's attack runs the sibling engine's CLI (R3, D-R16); its integration test needs it installed.
      - run: npm ci
        working-directory: poltergeist
      - run: npx playwright-core install --with-deps chromium
      - run: npm run health
