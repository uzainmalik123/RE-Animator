name: Secrets guard

# Blocks a PR that commits a real key: a filled-in .env.example, a token-shaped string in any
# committed env file, or a real .env at all (scripts/check-env-files.mjs). The `env-files` check is
# required on main by the "Protect main" ruleset, with no bypass for anyone. No path filter on
# purpose: a required check that never reports would block every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  env-files:
    name: env-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-env-files.test.mjs
      - run: node scripts/check-env-files.mjs
