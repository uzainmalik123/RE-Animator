name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Run PR-Agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          # NVIDIA API catalog (build.nvidia.com) via LiteLLM's nvidia_nim provider.
          # The OPENAI_KEY secret holds the NVIDIA (nvapi-...) key.
          NVIDIA_NIM_API_KEY: ${{ secrets.OPENAI_KEY }}
          NVIDIA_NIM_API_BASE: "https://integrate.api.nvidia.com/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "nvidia_nim/moonshotai/kimi-k2.6"
          config.fallback_models: '["nvidia_nim/deepseek-ai/deepseek-v4.1-flash", "nvidia_nim/z-ai/glm-5.3-flash"]'
          config.custom_model_max_tokens: "64000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
