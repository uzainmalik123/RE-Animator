<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- R1 sample art for the dot-matrix renderer: a headstone under a crescent moon.
       Hand-made for Reanimator during Kiroween 2026; same licence as this repo. Brightness only:
       the renderer turns it into dots and the ink colour comes from the palette. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#888"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="360" cy="78" r="40" fill="#fff"/>
      <circle cx="378" cy="66" r="36" fill="#000"/>
    </mask>
  </defs>
  <circle cx="360" cy="78" r="95" fill="url(#glow)"/>
  <rect x="0" y="0" width="480" height="360" fill="#fff" mask="url(#crescent)"/>
  <circle cx="240" cy="190" r="150" fill="url(#glow)" opacity="0.6"/>
  <path d="M160 300 V170 A80 80 0 0 1 320 170 V300 Z" fill="url(#stone)"/>
  <rect x="232" y="140" width="16" height="92" fill="#000" opacity="0.75"/>
  <rect x="204" y="166" width="72" height="16" fill="#000" opacity="0.75"/>
  <ellipse cx="240" cy="318" rx="230" ry="34" fill="url(#ground)"/>
</svg>
